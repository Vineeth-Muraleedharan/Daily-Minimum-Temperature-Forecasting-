<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Base dark background, barely-there navy-to-maroon diagonal -->
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1A"/>
      <stop offset="55%" stop-color="#10121E"/>
      <stop offset="100%" stop-color="#1F0E14"/>
    </linearGradient>

    <!-- Accent gradient for the badge motif -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1E3B"/>
      <stop offset="50%" stop-color="#5B2140"/>
      <stop offset="100%" stop-color="#9C2B3B"/>
    </linearGradient>

    <radialGradient id="badgeFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <mask id="fadeMask">
      <rect x="0" y="0" width="1920" height="1080" fill="url(#badgeFade)"/>
    </mask>
  </defs>

  <!-- base -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#baseGrad)"/>

  <!-- large soft badge circle, bottom-right, mostly off-canvas, faded -->
  <g opacity="0.16" mask="url(#fadeMask)">
    <circle cx="1650" cy="950" r="520" fill="url(#badgeGrad)"/>
  </g>

  <!-- thermometer icon, cyan outline, low opacity, anchored bottom-right -->
  <g transform="translate(1560,650)" stroke="#4FD1C5" stroke-width="10" fill="none"
     stroke-linecap="round" stroke-linejoin="round" opacity="0.22">
    <!-- bulb -->
    <circle cx="60" cy="330" r="55"/>
    <!-- stem -->
    <path d="M 30 330 L 30 70 a 30 30 0 0 1 60 0 L 90 330"/>
    <!-- mercury line -->
    <line x1="60" y1="300" x2="60" y2="120"/>
    <!-- scale ticks to the right -->
    <line x1="140" y1="90" x2="200" y2="90"/>
    <line x1="140" y1="140" x2="185" y2="140"/>
    <line x1="140" y1="190" x2="200" y2="190"/>
    <line x1="140" y1="240" x2="185" y2="240"/>
  </g>

  <!-- scattered droplets, varied size/opacity -->
  <g fill="#4FD1C5">
    <path opacity="0.18" d="M1420 560 c0 22 -18 34 -34 34 s-34 -12 -34 -34 c0 -22 34 -60 34 -60 s34 38 34 60 z"/>
    <path opacity="0.12" d="M1360 700 c0 15 -12 23 -23 23 s-23 -8 -23 -23 c0 -15 23 -40 23 -40 s23 25 23 40 z"/>
    <path opacity="0.10" d="M1480 780 c0 12 -10 19 -19 19 s-19 -7 -19 -19 c0 -12 19 -34 19 -34 s19 22 19 34 z"/>
  </g>

  <!-- faint dashed forecast trend line sweeping across the whole canvas -->
  <path d="M -50 780 C 300 700, 500 620, 760 660 S 1200 780, 1500 560 S 1850 300, 1980 260"
        stroke="#4FD1C5" stroke-width="3" fill="none" stroke-dasharray="14 12" opacity="0.15"/>
  <!-- a single "forecast point" marker on the trend line -->
  <circle cx="1500" cy="560" r="7" fill="#F56565" opacity="0.35"/>
</svg>
